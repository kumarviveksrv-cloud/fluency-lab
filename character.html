<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0E1A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fluency Lab">
  <title>Character</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="design-system.css">
  <style>
    /* ── Sub-header (back nav) ──────────────── */
    .sub-header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: var(--header-height);
      background: rgba(10, 14, 26, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--navy-border);
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: 0 var(--space-4);
      padding-top: var(--safe-top);
    }

    .back-btn {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-full);
      background: var(--navy-light);
      border: 1px solid var(--navy-border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      color: var(--text-secondary);
      transition: all var(--transition-fast);
    }

    .back-btn:hover,
    .back-btn:active {
      background: var(--navy-border);
      color: var(--text-primary);
    }

    .sub-header-title {
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* ── Hero card ──────────────────────────── */
    .hero-avatar {
      width: 64px;
      height: 64px;
      border-radius: var(--radius-lg);
      background: var(--navy);
      border: 1px solid var(--navy-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      flex-shrink: 0;
      line-height: 1;
    }

    .hero-meta {
      flex: 1;
      min-width: 0;
    }

    .hero-name {
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.15;
      letter-spacing: -0.02em;
      text-wrap: balance;
    }

    .hero-subtitle {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      margin-top: var(--space-1);
    }

    .hero-badges {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin-top: var(--space-3);
    }

    /* ── Content section ──────────────────── */
    .content-section {
      margin-top: var(--space-5);
    }

    .content-section-title {
      font-family: var(--font-display);
      font-size: var(--text-base);
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: var(--space-3);
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .content-section-title svg {
      color: var(--teal);
      flex-shrink: 0;
    }

    .dna-text {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      line-height: 1.7;
      white-space: pre-wrap;
      background: var(--navy-light);
      border: 1px solid var(--navy-border);
      border-radius: var(--radius-md);
      padding: var(--space-4);
    }

    .traits-text {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      line-height: 1.7;
      white-space: pre-wrap;
    }

    /* ── Phrase list item ──────────────────── */
    .phrase-row {
      display: flex;
      align-items: flex-start;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-4);
      background: var(--navy-mid);
      border: 1px solid var(--navy-border);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .phrase-row:hover,
    .phrase-row:active {
      border-color: var(--teal-dim);
      background: var(--navy-light);
    }

    .phrase-row:active {
      transform: scale(0.98);
    }

    .phrase-row-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--teal);
      flex-shrink: 0;
      margin-top: 6px;
    }

    .phrase-row-body {
      flex: 1;
      min-width: 0;
    }

    .phrase-row-text {
      font-size: var(--text-base);
      color: var(--text-primary);
      line-height: 1.5;
    }

    .phrase-row-meta {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-top: var(--space-2);
      flex-wrap: wrap;
    }

    .practice-count {
      font-size: var(--text-xs);
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .phrase-row-arrow {
      color: var(--text-muted);
      flex-shrink: 0;
      margin-top: 2px;
    }

    /* ── Phrases list container ────────────── */
    #phraseList {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }

    /* ── Change mastery button row ──────────── */
    .mastery-action-row {
      margin-top: var(--space-5);
    }

    .mastery-next-hint {
      font-size: var(--text-xs);
      color: var(--text-muted);
      text-align: center;
      margin-top: var(--space-2);
    }

    /* ── Loading / error wrapper ────────────── */
    #pageContent {
      /* holds all loaded content */
    }
  </style>
</head>
<body>
<div class="app-shell">

  <!-- SUB-HEADER -->
  <header class="sub-header">
    <button class="back-btn" id="backBtn" aria-label="Go back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <span class="sub-header-title">Character</span>
  </header>

  <!-- CONTENT -->
  <main class="app-content">
    <div id="pageContent">
      <!-- Populated by JS -->
    </div>
  </main>

  <!-- TAB BAR -->
  <div id="tabBar"></div>

</div>

<script src="app.js"></script>
<script src="airtable.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {

  // ─── SETUP ─────────────────────────────────
  document.getElementById('tabBar').innerHTML = buildTabBar('characters');
  document.getElementById('backBtn').addEventListener('click', () => NAV.back());

  const params = NAV.getParams();
  const characterId = params.characterId;
  const pageContent = document.getElementById('pageContent');

  if (!characterId) {
    showError(pageContent, 'No character selected.', () => NAV.go('characters.html'));
    return;
  }

  // ─── LOAD ──────────────────────────────────
  showLoading(pageContent, 'Loading character...');

  let character, phrases;

  try {
    [character, phrases] = await Promise.all([
      AIRTABLE.getCharacterById(characterId),
      AIRTABLE.getPhrases({ characterId }),
    ]);
  } catch (err) {
    showError(pageContent, 'Could not load this character.', () => location.reload());
    console.error(err);
    return;
  }

  const f = character.fields;
  const name      = f['Character Name'] || 'Unnamed Character';
  const showFilm  = f['Show/Film'] || '';
  const archetype = f['Archetype Title'] || '';
  const week      = f['Week Assigned'] || '';
  const mastery   = f['Mastery Status'] || 'New';
  const voiceDNA  = f['Voice DNA Notes'] || '';
  const coreTraits= f['Core Traits'] || '';

  // ─── RENDER PAGE ───────────────────────────
  pageContent.innerHTML = `
    <!-- HERO CARD -->
    <div class="card-teal fade-in">
      <div class="flex items-start gap-3">
        <div class="hero-avatar">🎭</div>
        <div class="hero-meta">
          <div class="hero-name">${escapeHTML(name)}</div>
          ${showFilm ? `<div class="hero-subtitle">${escapeHTML(showFilm)}</div>` : ''}
        </div>
      </div>
      <div class="hero-badges">
        ${archetype ? `<span class="badge badge-teal">${escapeHTML(archetype)}</span>` : ''}
        ${week ? `<span class="badge badge-muted">Week ${week}</span>` : ''}
        ${MASTERY.badge(mastery)}
      </div>
    </div>

    <!-- VOICE DNA -->
    ${voiceDNA ? `
      <div class="content-section">
        <div class="content-section-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="22"/>
          </svg>
          Voice DNA
        </div>
        <div class="dna-text">${escapeHTML(voiceDNA)}</div>
      </div>
    ` : ''}

    <!-- CORE TRAITS -->
    ${coreTraits ? `
      <div class="content-section">
        <div class="content-section-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
          Core Traits
        </div>
        <div class="traits-text text-secondary body-sm">${escapeHTML(coreTraits)}</div>
      </div>
    ` : ''}

    <!-- YOUR PHRASES -->
    <div class="content-section">
      <div class="content-section-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        Your Phrases
        <span class="badge badge-muted" style="margin-left:auto;font-size:10px;" id="phraseCount">—</span>
      </div>
      <div id="phraseList">
        <!-- Populated after character load -->
      </div>
    </div>

    <!-- CHANGE MASTERY -->
    <div class="mastery-action-row">
      <button class="btn btn-secondary w-full" id="changeMasteryBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"/>
          <polyline points="23 20 23 14 17 14"/>
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/>
        </svg>
        Change Mastery Level
      </button>
      <div class="mastery-next-hint" id="masteryHint"></div>
    </div>
  `;

  // ─── RENDER PHRASES ────────────────────────
  const phraseListEl = document.getElementById('phraseList');
  document.getElementById('phraseCount').textContent = phrases.length;

  if (phrases.length === 0) {
    phraseListEl.innerHTML = `
      <div class="empty-state" style="padding: var(--space-8) 0;">
        <div class="empty-icon" style="font-size:32px;opacity:0.4;">💬</div>
        <p class="body-sm text-muted" style="text-align:center;">No phrases linked to this character yet.</p>
      </div>
    `;
  } else {
    phraseListEl.innerHTML = phrases.map(p => {
      const pf = p.fields;
      const phraseText  = pf['Phrase Text'] || '';
      const masteryLvl  = pf['Mastery Level'] || 'New';
      const practiceCount = pf['Practice Count'] || 0;

      return `
        <div class="phrase-row" data-phrase-id="${p.id}">
          <div class="phrase-row-dot"></div>
          <div class="phrase-row-body">
            <div class="phrase-row-text">${escapeHTML(phraseText)}</div>
            <div class="phrase-row-meta">
              ${MASTERY.badge(masteryLvl)}
              ${practiceCount > 0 ? `
                <span class="practice-count">${practiceCount} practice${practiceCount !== 1 ? 's' : ''}</span>
              ` : ''}
            </div>
          </div>
          <svg class="phrase-row-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </div>
      `;
    }).join('');

    phraseListEl.querySelectorAll('.phrase-row').forEach(row => {
      row.addEventListener('click', () => {
        NAV.go('phrase.html', { phraseId: row.dataset.phraseId });
      });
    });
  }

  // ─── MASTERY CYCLE ─────────────────────────
  // Cycle: New → Learning → Practicing → Deployed → Muscle Memory → Signature Move → New
  const masteryOrder = MASTERY.levels;
  let currentMastery = mastery;

  function updateMasteryHint() {
    const next = MASTERY.nextLevel(currentMastery);
    const hintEl = document.getElementById('masteryHint');
    if (hintEl) {
      hintEl.textContent = next
        ? `Current: ${currentMastery} → Next: ${next}`
        : `Current: ${currentMastery} (maximum level)`;
    }
  }

  updateMasteryHint();

  document.getElementById('changeMasteryBtn').addEventListener('click', async () => {
    const btn = document.getElementById('changeMasteryBtn');

    // Compute next level (cycles back to start if at end)
    const currentIdx = masteryOrder.indexOf(currentMastery);
    const nextLevel = masteryOrder[(currentIdx + 1) % masteryOrder.length];

    btn.disabled = true;
    btn.innerHTML = `
      <div class="spinner" style="width:16px;height:16px;border-width:2px;"></div>
      Saving...
    `;

    try {
      await AIRTABLE.updateCharacterMastery(characterId, nextLevel);
      currentMastery = nextLevel;

      // Update hero mastery badge
      const heroBadges = document.querySelector('.hero-badges');
      if (heroBadges) {
        // Replace mastery badge (last badge or the one matching old level)
        const oldBadge = heroBadges.querySelector('.badge:last-child');
        if (oldBadge) oldBadge.outerHTML = MASTERY.badge(currentMastery);
      }

      updateMasteryHint();
      TOAST.success(`Mastery updated to "${nextLevel}"`);
    } catch (err) {
      TOAST.error('Could not update mastery. Try again.');
      console.error(err);
    } finally {
      btn.disabled = false;
      btn.innerHTML = `
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"/>
          <polyline points="23 20 23 14 17 14"/>
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/>
        </svg>
        Change Mastery Level
      `;
    }
  });

  // ─── UTILS ─────────────────────────────────
  function escapeHTML(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0E1A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fluency Lab">
  <title>Characters</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="design-system.css">
  <style>
    /* ── Character card layout ─────────────────── */
    .character-card {
      background: var(--navy-mid);
      border: 1px solid var(--navy-border);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      display: flex;
      gap: var(--space-3);
      cursor: pointer;
      transition: all var(--transition-fast);
      position: relative;
      overflow: hidden;
    }

    .character-card:hover,
    .character-card:active {
      border-color: var(--teal-dim);
      background: var(--navy-light);
      box-shadow: var(--shadow-teal);
    }

    .character-card:active {
      transform: scale(0.98);
    }

    .char-avatar {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-md);
      background: var(--navy);
      border: 1px solid var(--navy-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
      line-height: 1;
    }

    .char-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
    }

    .char-name {
      font-family: var(--font-display);
      font-size: var(--text-lg);
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    .char-show {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .char-badges {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex-wrap: wrap;
      margin-top: var(--space-1);
    }

    .char-week-corner {
      position: absolute;
      top: var(--space-3);
      right: var(--space-3);
    }

    .char-mastery-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: var(--space-2);
      padding-top: var(--space-2);
      border-top: 1px solid var(--navy-border);
    }

    .char-mastery-row .badge {
      font-size: 10px;
    }

    .char-arrow {
      color: var(--text-muted);
      flex-shrink: 0;
    }

    /* ── Filter chips row ──────────────────────── */
    .filter-row {
      margin-bottom: var(--space-4);
    }

    /* ── Character list ────────────────────────── */
    #characterList {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }

    /* ── Week group label ──────────────────────── */
    .week-group-label {
      font-size: var(--text-xs);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-top: var(--space-2);
      margin-bottom: var(--space-1);
      padding-left: var(--space-1);
    }

    .week-group-label:first-child {
      margin-top: 0;
    }
  </style>
</head>
<body>
<div class="app-shell">

  <!-- HEADER -->
  <header class="app-header">
    <div>
      <div class="header-title">Characters</div>
      <div class="header-subtitle" id="headerDate"></div>
    </div>
    <div class="flex items-center gap-3">
      <span class="badge badge-teal" id="streakBadge">🔥 0</span>
    </div>
  </header>

  <!-- CONTENT -->
  <main class="app-content">

    <!-- WEEK FILTER CHIPS -->
    <div class="filter-row">
      <div class="chip-group" id="weekFilters">
        <button class="chip active" data-week="all">All</button>
        <!-- Week chips populated dynamically -->
      </div>
    </div>

    <!-- CHARACTER LIST -->
    <div id="characterList">
      <!-- Populated by JS -->
    </div>

  </main>

  <!-- TAB BAR -->
  <div id="tabBar"></div>

</div>

<script src="app.js"></script>
<script src="airtable.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {

  // ─── HEADER ────────────────────────────────
  document.getElementById('headerDate').textContent =
    new Date().toLocaleDateString('en-IN', { weekday: 'long', month: 'short', day: 'numeric' });
  document.getElementById('streakBadge').textContent = `🔥 ${STORE.getStreak()}`;
  document.getElementById('tabBar').innerHTML = buildTabBar('characters');

  // ─── STATE ─────────────────────────────────
  let allCharacters = [];
  let activeWeek = 'all';

  // ─── LOAD ──────────────────────────────────
  const listEl = document.getElementById('characterList');
  showLoading(listEl, 'Loading characters...');

  try {
    allCharacters = await AIRTABLE.getCharacters();
    buildWeekFilters(allCharacters);
    renderCharacters(allCharacters);
  } catch (err) {
    showError(listEl, 'Could not load characters.', () => location.reload());
    console.error(err);
  }

  // ─── WEEK FILTER BUILDER ───────────────────
  function buildWeekFilters(characters) {
    const weeks = [...new Set(
      characters
        .map(c => c.fields['Week Assigned'])
        .filter(Boolean)
        .map(Number)
        .sort((a, b) => a - b)
    )];

    const filtersEl = document.getElementById('weekFilters');

    weeks.forEach(week => {
      const btn = document.createElement('button');
      btn.className = 'chip';
      btn.dataset.week = String(week);
      btn.textContent = `Week ${week}`;
      filtersEl.appendChild(btn);
    });

    filtersEl.addEventListener('click', e => {
      const btn = e.target.closest('.chip');
      if (!btn) return;

      filtersEl.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');

      activeWeek = btn.dataset.week;
      const filtered = activeWeek === 'all'
        ? allCharacters
        : allCharacters.filter(c => String(c.fields['Week Assigned']) === activeWeek);

      renderCharacters(filtered);
    });
  }

  // ─── RENDER ────────────────────────────────
  function renderCharacters(characters) {
    if (characters.length === 0) {
      listEl.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🎭</div>
          <p class="empty-title">No characters yet</p>
          <p class="empty-description">Characters you're studying will appear here, organised by week.</p>
        </div>
      `;
      return;
    }

    // Group by week when showing all, or flat list when filtered
    if (activeWeek === 'all') {
      const byWeek = {};
      characters.forEach(c => {
        const w = c.fields['Week Assigned'] || 0;
        if (!byWeek[w]) byWeek[w] = [];
        byWeek[w].push(c);
      });

      let html = '';
      Object.keys(byWeek).sort((a, b) => Number(a) - Number(b)).forEach(week => {
        html += `<div class="week-group-label">Week ${week}</div>`;
        byWeek[week].forEach(c => { html += characterCardHTML(c); });
      });
      listEl.innerHTML = html;
    } else {
      listEl.innerHTML = characters.map(c => characterCardHTML(c)).join('');
    }

    // Attach tap handlers
    listEl.querySelectorAll('.character-card').forEach(card => {
      card.addEventListener('click', () => {
        NAV.go('character.html', { characterId: card.dataset.id });
      });
    });
  }

  // ─── CARD HTML ─────────────────────────────
  function characterCardHTML(record) {
    const f = record.fields;
    const name       = f['Character Name'] || 'Unnamed Character';
    const showFilm   = f['Show/Film'] || '';
    const archetype  = f['Archetype Title'] || '';
    const week       = f['Week Assigned'] || '';
    const mastery    = f['Mastery Status'] || 'New';

    return `
      <div class="character-card fade-in" data-id="${record.id}">
        <!-- Week chip — top-right -->
        ${week ? `<div class="char-week-corner"><span class="badge badge-muted">Week ${week}</span></div>` : ''}

        <!-- Avatar + body -->
        <div class="char-avatar">🎭</div>

        <div class="char-body">
          <div class="char-name">${escapeHTML(name)}</div>
          ${showFilm ? `<div class="char-show">${escapeHTML(showFilm)}</div>` : ''}

          ${archetype ? `
            <div class="char-badges">
              <span class="badge badge-teal">${escapeHTML(archetype)}</span>
            </div>
          ` : ''}

          <div class="char-mastery-row">
            ${MASTERY.badge(mastery)}
            <svg class="char-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </div>
        </div>
      </div>
    `;
  }

  // ─── UTILS ─────────────────────────────────
  function escapeHTML(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

});
</script>
</body>
</html>

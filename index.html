<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0E1A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fluency Lab">
  <title>Fluency Lab</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="design-system.css">
</head>
<body>
<div class="app-shell">

  <!-- HEADER -->
  <header class="app-header">
    <div>
      <div class="header-title">Fluency Lab</div>
      <div class="header-subtitle" id="headerDate"></div>
    </div>
    <div class="flex items-center gap-3">
      <span class="badge badge-teal" id="streakBadge">🔥 0</span>
    </div>
  </header>

  <!-- CONTENT -->
  <main class="app-content">

    <!-- MORNING STATUS -->
    <section class="card mb-4" id="morningCard">
      <div class="flex items-center justify-between mb-3">
        <span class="subheading">Morning Readiness</span>
        <span class="badge badge-muted" id="timeOfDayBadge">Morning</span>
      </div>

      <div class="flex items-center gap-3 mb-4">
        <div class="flex-1">
          <div class="body-sm text-secondary mb-2">Tongue-tie score</div>
          <div class="slider-wrap">
            <input type="range" class="slider" id="tongueTieSlider" min="1" max="10" value="5">
            <span class="slider-label" id="tongueTieValue">5</span>
          </div>
        </div>
      </div>

      <div id="warmupSection">
        <!-- Shows either warmup button or done state -->
      </div>
    </section>

    <!-- TODAY'S MISSION -->
    <section id="missionSection">
      <div class="section-header">
        <span class="section-title">Today's Mission</span>
        <span class="body-xs text-muted" id="dayCounter">Day 1</span>
      </div>

      <div id="missionContent">
        <!-- Populated by JS -->
      </div>
    </section>

    <!-- QUICK ACTIONS -->
    <section class="mt-6">
      <div class="section-header">
        <span class="section-title">Quick Actions</span>
      </div>

      <div class="list">
        <div class="list-item" onclick="NAV.go('log.html')">
          <div style="width:40px;height:40px;border-radius:var(--radius-md);background:var(--amber-glow);display:flex;align-items:center;justify-content:center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
          <div class="list-item-content">
            <div class="list-item-title">Log a Conversation</div>
            <div class="list-item-subtitle">Record a real-world phrase deployment</div>
          </div>
          <div class="list-item-right"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></div>
        </div>

        <div class="list-item" onclick="NAV.go('phrases.html')">
          <div style="width:40px;height:40px;border-radius:var(--radius-md);background:var(--teal-glow);display:flex;align-items:center;justify-content:center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14B8A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>
          <div class="list-item-content">
            <div class="list-item-title">Phrase Vault</div>
            <div class="list-item-subtitle">Browse your full arsenal</div>
          </div>
          <div class="list-item-right"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></div>
        </div>

        <div class="list-item" onclick="NAV.go('progress.html')">
          <div style="width:40px;height:40px;border-radius:var(--radius-md);background:rgba(139,92,246,0.15);display:flex;align-items:center;justify-content:center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></div>
          <div class="list-item-content">
            <div class="list-item-title">My Progress</div>
            <div class="list-item-subtitle">Fluency stability & streak</div>
          </div>
          <div class="list-item-right"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></div>
        </div>
      </div>
    </section>

  </main>

  <!-- TAB BAR -->
  <div id="tabBar"></div>

</div>

<script src="app.js"></script>
<script src="airtable.js"></script>
<script src="audio.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {

  // ─── HEADER DATE ───────────────────────────
  document.getElementById('headerDate').textContent =
    new Date().toLocaleDateString('en-IN', { weekday: 'long', month: 'short', day: 'numeric' });
  document.getElementById('timeOfDayBadge').textContent = TIME.timeOfDay();
  document.getElementById('streakBadge').textContent = `🔥 ${STORE.getStreak()}`;

  // ─── TAB BAR ───────────────────────────────
  document.getElementById('tabBar').innerHTML = buildTabBar('today');

  // ─── TONGUE TIE SLIDER ─────────────────────
  const slider = document.getElementById('tongueTieSlider');
  const sliderVal = document.getElementById('tongueTieValue');
  const savedScore = STORE.getTongueTieScore();
  if (savedScore) { slider.value = savedScore; sliderVal.textContent = savedScore; }

  slider.addEventListener('input', () => {
    sliderVal.textContent = slider.value;
    STORE.setTongueTieScore(parseInt(slider.value));
  });

  // ─── WARMUP STATUS ─────────────────────────
  const warmupDone = STORE.getWarmupDone();
  const warmupSection = document.getElementById('warmupSection');

  if (warmupDone) {
    warmupSection.innerHTML = `
      <div class="flex items-center gap-2" style="color:var(--teal);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        <span class="body-sm" style="color:var(--teal);">Warm-up complete</span>
      </div>
    `;
  } else {
    warmupSection.innerHTML = `
      <button class="btn btn-secondary w-full" onclick="NAV.go('warmup.html')">
        🌅 Start Morning Warm-Up
      </button>
    `;
  }

  // ─── TODAY'S MISSION ───────────────────────
  const missionContent = document.getElementById('missionContent');
  showLoading(missionContent, 'Loading your mission...');

  try {
    const mission = await AIRTABLE.getTodayMission();

    if (!mission) {
      missionContent.innerHTML = `
        <div class="card">
          <div class="empty-state" style="padding: 2rem 0;">
            <div class="empty-icon">📋</div>
            <p class="empty-title">No mission yet</p>
            <p class="empty-description">Your daily mission will appear here once set up in Airtable.</p>
          </div>
        </div>
      `;
      return;
    }

    const f = mission.fields;

    // Fetch linked character and phrases
    const character = f['Today\'s Character']?.[0]
      ? await AIRTABLE.getCharacterById(f['Today\'s Character'][0]) : null;
    const [phrases, situation] = await Promise.all([
      AIRTABLE.getTodayPhrases(character?.fields?.['Character Name']),
      f['Today\'s Situation']?.[0] ? AIRTABLE.getSituationById(f['Today\'s Situation'][0]) : null,
    ]);

    const charName = character?.fields?.['Character Name'] || 'Patrick Jane';
    const charArchetype = character?.fields?.['Archetype Title'] || 'The Charming Consultant';
    const weekNum = character?.fields?.['Week Assigned'] || 1;
    const sitName = situation?.fields?.['Situation Name'] || 'Difficult Client Call';
    const sitDiff = situation?.fields?.['Difficulty Level'] || 'Medium';

    document.getElementById('dayCounter').textContent =
      `Week ${weekNum} · ${TIME.timeOfDay()}`;

    missionContent.innerHTML = `
      <div class="card-teal fade-in">

        <!-- Character -->
        <div class="flex items-center gap-3 mb-4">
          <div style="width:52px;height:52px;border-radius:var(--radius-md);background:var(--navy);display:flex;align-items:center;justify-content:center;font-size:28px;border:1px solid var(--navy-border);">🎭</div>
          <div>
            <div class="heading">${charName}</div>
            <div class="body-sm text-secondary">${charArchetype}</div>
          </div>
          <div class="badge badge-teal ml-auto">Week ${weekNum}</div>
        </div>

        <!-- Today's Phrases -->
        <div class="mb-4">
          <div class="subheading mb-2">Today's Phrases</div>
          <div class="list" style="gap:var(--space-2);">
            ${phrases.map(p => `
              <div style="display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) 0;">
                <div style="width:6px;height:6px;border-radius:50%;background:var(--teal);flex-shrink:0;"></div>
                <span class="body-sm">${p.fields['Phrase Text']}</span>
              </div>
            `).join('')}
          </div>
        </div>

        <div class="divider"></div>

        <!-- Situation -->
        <div class="flex items-center justify-between mb-4">
          <div>
            <div class="subheading mb-1">Situation</div>
            <div class="body-md">${sitName}</div>
          </div>
          <div>${difficultyDots(sitDiff)}</div>
        </div>

        <!-- CTA -->
        <button class="btn btn-primary btn-lg" onclick="NAV.go('practice.html', { missionId: '${mission.id}' })">
          Start 15-Min Session →
        </button>
      </div>
    `;

  } catch (err) {
    showError(missionContent, 'Could not load today\'s mission.', () => location.reload());
    console.error(err);
  }

});
</script>
</body>
</html>

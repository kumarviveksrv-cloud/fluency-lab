<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0E1A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Phrase Detail · Fluency Lab</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="design-system.css">
  <style>
    /* ── Sub-header ── */
    .sub-header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: var(--header-height);
      background: rgba(10, 14, 26, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--navy-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-4);
      padding-top: var(--safe-top);
    }

    .sub-header-back {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--teal);
      font-size: var(--text-sm);
      font-weight: 500;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      min-width: 64px;
    }

    .sub-header-title {
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* ── Hero phrase card ── */
    .phrase-hero {
      background: var(--navy-light);
      border: 1px solid var(--navy-border);
      border-radius: var(--radius-xl);
      padding: var(--space-8) var(--space-6);
      position: relative;
      overflow: hidden;
      text-align: center;
      margin-bottom: var(--space-4);
    }

    .phrase-hero::before {
      content: '"';
      position: absolute;
      top: -24px;
      left: var(--space-4);
      font-family: var(--font-display);
      font-size: 140px;
      color: var(--teal);
      opacity: 0.05;
      line-height: 1;
      pointer-events: none;
    }

    .phrase-hero-text {
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
      position: relative;
      z-index: 1;
      margin-bottom: var(--space-4);
    }

    .phrase-hero-badges {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      flex-wrap: wrap;
    }

    /* ── Info sections ── */
    .info-section {
      margin-bottom: var(--space-4);
    }

    .info-section-label {
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: var(--space-2);
    }

    .info-section-body {
      font-size: var(--text-base);
      color: var(--text-secondary);
      line-height: 1.65;
    }

    /* ── Speaking skeleton badge ── */
    .skeleton-badge {
      display: inline-flex;
      align-items: center;
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-md);
      background: rgba(0, 229, 195, 0.08);
      border: 1px solid rgba(0, 229, 195, 0.2);
      font-family: var(--font-mono);
      font-size: var(--text-sm);
      color: var(--teal);
      line-height: 1.5;
      width: 100%;
    }

    /* ── Stats row ── */
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-3);
      margin-bottom: var(--space-4);
    }

    .stat-tile {
      background: var(--navy-mid);
      border: 1px solid var(--navy-border);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
    }

    .stat-tile-value {
      font-family: var(--font-display);
      font-size: var(--text-3xl);
      font-weight: 800;
      color: var(--teal);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .stat-tile-label {
      font-size: var(--text-xs);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 500;
    }

    /* ── Notes area ── */
    .notes-section {
      margin-bottom: var(--space-4);
    }

    .notes-label {
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: var(--space-2);
    }

    .notes-textarea {
      width: 100%;
      padding: var(--space-3) var(--space-4);
      background: var(--navy-light);
      border: 1px solid var(--navy-border);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: var(--text-base);
      resize: vertical;
      min-height: 100px;
      outline: none;
      transition: border-color var(--transition-fast);
      font-family: var(--font-body);
    }

    .notes-textarea:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px var(--teal-glow);
    }

    .notes-textarea::placeholder {
      color: var(--text-muted);
    }

    .notes-saving {
      font-size: var(--text-xs);
      color: var(--text-muted);
      text-align: right;
      margin-top: var(--space-1);
      min-height: 18px;
      transition: opacity var(--transition-fast);
    }

    /* ── Action buttons row ── */
    .action-row {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      margin-bottom: var(--space-6);
    }

    /* ── Active toggle button ── */
    .active-toggle-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: var(--space-4);
      border-radius: var(--radius-lg);
      border: 1px solid var(--navy-border);
      background: var(--navy-mid);
      cursor: pointer;
      transition: all var(--transition-fast);
      font-family: var(--font-body);
    }

    .active-toggle-btn:hover {
      border-color: var(--teal-dim);
      background: var(--navy-light);
    }

    .active-toggle-btn.is-active {
      border-color: var(--teal-dim);
      background: var(--teal-glow);
    }

    .active-toggle-label {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    .active-toggle-icon {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--navy-light);
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .active-toggle-btn.is-active .active-toggle-icon {
      background: var(--teal-glow-strong);
      color: var(--teal);
    }

    .active-toggle-text {
      text-align: left;
    }

    .active-toggle-title {
      font-size: var(--text-base);
      font-weight: 600;
      color: var(--text-primary);
    }

    .active-toggle-subtitle {
      font-size: var(--text-xs);
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .toggle-indicator {
      width: 44px;
      height: 26px;
      border-radius: var(--radius-full);
      background: var(--navy-border);
      position: relative;
      transition: background var(--transition-fast);
      flex-shrink: 0;
    }

    .active-toggle-btn.is-active .toggle-indicator {
      background: var(--teal);
    }

    .toggle-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      border-radius: var(--radius-full);
      background: white;
      transition: transform var(--transition-fast);
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    .active-toggle-btn.is-active .toggle-thumb {
      transform: translateX(18px);
    }

    /* ── Level up button ── */
    .levelup-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: var(--space-4);
      border-radius: var(--radius-lg);
      border: 1px solid var(--amber-dim);
      background: var(--amber-glow);
      cursor: pointer;
      transition: all var(--transition-fast);
      font-family: var(--font-body);
    }

    .levelup-btn:hover {
      background: rgba(245, 166, 35, 0.22);
    }

    .levelup-left {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    .levelup-icon {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-md);
      background: rgba(245, 166, 35, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--amber);
      flex-shrink: 0;
    }

    .levelup-text {
      text-align: left;
    }

    .levelup-title {
      font-size: var(--text-base);
      font-weight: 600;
      color: var(--amber);
    }

    .levelup-subtitle {
      font-size: var(--text-xs);
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .levelup-arrow {
      color: var(--amber);
      font-size: var(--text-lg);
      font-weight: 700;
    }
  </style>
</head>
<body>
<div class="app-shell">

  <!-- SUB-HEADER -->
  <header class="sub-header">
    <button class="sub-header-back" onclick="NAV.back()" aria-label="Go back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Back
    </button>
    <span class="sub-header-title">Phrase</span>
    <div style="min-width:64px;"></div>
  </header>

  <!-- CONTENT -->
  <main class="app-content" id="mainContent">
    <!-- Loaded by JS -->
  </main>

  <!-- TAB BAR -->
  <div id="tabBarMount"></div>

</div>

<script src="app.js"></script>
<script src="airtable.js"></script>
<script>
  // ─── STATE ────────────────────────────────────
  let phraseRecord = null;
  let isSavingNotes = false;
  let notesSaveTimer = null;

  // ─── INIT ─────────────────────────────────────
  document.addEventListener('DOMContentLoaded', async () => {
    document.getElementById('tabBarMount').innerHTML = buildTabBar('phrases');

    const params = NAV.getParams();
    const phraseId = params.phraseId;

    if (!phraseId) {
      showError(document.getElementById('mainContent'), 'No phrase specified.', () => NAV.go('phrases.html'));
      return;
    }

    await loadPhrase(phraseId);
  });

  // ─── LOAD PHRASE ──────────────────────────────
  async function loadPhrase(id) {
    const container = document.getElementById('mainContent');
    showLoading(container, 'Loading phrase...');

    try {
      phraseRecord = await AIRTABLE.getPhraseById(id);
      renderPhrase(phraseRecord);
    } catch (err) {
      console.error(err);
      showError(container, 'Could not load this phrase.', () => loadPhrase(id));
    }
  }

  // ─── RENDER ───────────────────────────────────
  function renderPhrase(record) {
    const f = record.fields;
    const container = document.getElementById('mainContent');

    const mastery       = f['Mastery Level'] || 'New';
    const category      = f['Category'] || '';
    const isActive      = !!f['In Active Rotation'];
    const practiceCount = f['Practice Count'] || 0;
    const deployments   = f['Real World Deployments'] || 0;
    const notes         = f['Personal Notes'] || '';
    const skeleton      = f['Speaking Skeleton'] || '';
    const context       = f['Context / When To Use'] || '';
    const mechanism     = f['Power Mechanism'] || '';
    const example       = f['Example Deployment'] || '';
    const nextLevel     = MASTERY.nextLevel(mastery);

    container.innerHTML = `
      <!-- HERO PHRASE CARD -->
      <div class="phrase-hero">
        <div class="phrase-hero-text">${escapeHtml(f['Phrase Text'] || '—')}</div>
        <div class="phrase-hero-badges">
          ${category ? `<span class="badge badge-teal">${escapeHtml(category)}</span>` : ''}
          ${MASTERY.badge(mastery)}
        </div>
      </div>

      <!-- WHEN TO USE -->
      ${context ? `
        <div class="info-section card">
          <div class="info-section-label">When to Use</div>
          <div class="info-section-body">${escapeHtml(context)}</div>
        </div>
      ` : ''}

      <!-- POWER MECHANISM -->
      ${mechanism ? `
        <div class="info-section card" style="border-color:rgba(139,92,246,0.2);background:rgba(139,92,246,0.05);">
          <div class="info-section-label" style="color:#8B5CF6;">Power Mechanism</div>
          <div class="info-section-body">${escapeHtml(mechanism)}</div>
        </div>
      ` : ''}

      <!-- EXAMPLE DEPLOYMENT -->
      ${example ? `
        <div class="info-section card">
          <div class="info-section-label">Example Deployment</div>
          <div class="info-section-body" style="font-style:italic;">"${escapeHtml(example)}"</div>
        </div>
      ` : ''}

      <!-- SPEAKING SKELETON -->
      ${skeleton ? `
        <div class="info-section">
          <div class="info-section-label">Speaking Skeleton</div>
          <div class="skeleton-badge">${escapeHtml(skeleton)}</div>
        </div>
      ` : ''}

      <div class="divider"></div>

      <!-- STATS ROW -->
      <div class="stats-row">
        <div class="stat-tile">
          <div class="stat-tile-value">${practiceCount}</div>
          <div class="stat-tile-label">Practices</div>
        </div>
        <div class="stat-tile">
          <div class="stat-tile-value" style="color:var(--amber);">${deployments}</div>
          <div class="stat-tile-label">Real Deployments</div>
        </div>
      </div>

      <!-- PERSONAL NOTES -->
      <div class="notes-section">
        <div class="notes-label">Personal Notes</div>
        <textarea
          id="personalNotes"
          class="notes-textarea"
          placeholder="Add your own context, reminders, or observations…"
        >${escapeHtml(notes)}</textarea>
        <div class="notes-saving" id="notesSavingStatus"></div>
      </div>

      <div class="divider"></div>

      <!-- ACTIONS -->
      <div class="action-row">

        <!-- ACTIVE ROTATION TOGGLE -->
        <button
          class="active-toggle-btn ${isActive ? 'is-active' : ''}"
          id="activeToggleBtn"
          onclick="toggleActive()"
          aria-pressed="${isActive}"
        >
          <div class="active-toggle-label">
            <div class="active-toggle-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
              </svg>
            </div>
            <div class="active-toggle-text">
              <div class="active-toggle-title">In Active Rotation</div>
              <div class="active-toggle-subtitle" id="activeToggleSubtitle">${isActive ? 'Appearing in daily practice' : 'Not in daily practice'}</div>
            </div>
          </div>
          <div class="toggle-indicator">
            <div class="toggle-thumb"></div>
          </div>
        </button>

        <!-- LEVEL UP BUTTON (shown when not at Signature Move) -->
        ${nextLevel ? `
          <button class="levelup-btn" id="levelUpBtn" onclick="levelUp()">
            <div class="levelup-left">
              <div class="levelup-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
                  <polyline points="17 6 23 6 23 12"/>
                </svg>
              </div>
              <div class="levelup-text">
                <div class="levelup-title">Level Up</div>
                <div class="levelup-subtitle">${escapeHtml(mastery)} → ${escapeHtml(nextLevel)}</div>
              </div>
            </div>
            <span class="levelup-arrow">→</span>
          </button>
        ` : `
          <div class="badge badge-signature" style="width:100%;justify-content:center;padding:var(--space-3);font-size:var(--text-sm);">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            </svg>
            Signature Move — Mastery Complete
          </div>
        `}

      </div>
    `;

    // Wire up notes auto-save
    const notesEl = document.getElementById('personalNotes');
    notesEl.addEventListener('blur', saveNotes);
    notesEl.addEventListener('input', onNotesInput);
  }

  // ─── NOTES AUTO-SAVE ──────────────────────────
  function onNotesInput() {
    clearTimeout(notesSaveTimer);
    const statusEl = document.getElementById('notesSavingStatus');
    if (statusEl) statusEl.textContent = '';
    notesSaveTimer = setTimeout(saveNotes, 2000);
  }

  async function saveNotes() {
    if (!phraseRecord) return;
    const notesEl = document.getElementById('personalNotes');
    const statusEl = document.getElementById('notesSavingStatus');
    if (!notesEl) return;

    const notes = notesEl.value;
    if (notes === (phraseRecord.fields['Personal Notes'] || '')) return; // no change

    if (isSavingNotes) return;
    isSavingNotes = true;

    if (statusEl) statusEl.textContent = 'Saving…';

    try {
      await AIRTABLE.updatePhraseNotes(phraseRecord.id, notes);
      phraseRecord.fields['Personal Notes'] = notes;
      if (statusEl) statusEl.textContent = 'Saved';
      TOAST.success('Notes saved');
      setTimeout(() => { if (statusEl) statusEl.textContent = ''; }, 3000);
    } catch (err) {
      console.error(err);
      if (statusEl) statusEl.textContent = 'Error saving';
      TOAST.error('Could not save notes');
    } finally {
      isSavingNotes = false;
    }
  }

  // ─── TOGGLE ACTIVE ROTATION ───────────────────
  async function toggleActive() {
    if (!phraseRecord) return;
    const btn = document.getElementById('activeToggleBtn');
    const subtitle = document.getElementById('activeToggleSubtitle');
    const current = !!phraseRecord.fields['In Active Rotation'];
    const next = !current;

    // Optimistic UI
    btn.classList.toggle('is-active', next);
    btn.setAttribute('aria-pressed', next);
    if (subtitle) subtitle.textContent = next ? 'Appearing in daily practice' : 'Not in daily practice';
    phraseRecord.fields['In Active Rotation'] = next;

    try {
      await AIRTABLE.update('Phrases', phraseRecord.id, { 'In Active Rotation': next });
      TOAST.success(next ? 'Added to active rotation' : 'Removed from active rotation');
    } catch (err) {
      console.error(err);
      // Revert
      btn.classList.toggle('is-active', current);
      btn.setAttribute('aria-pressed', current);
      if (subtitle) subtitle.textContent = current ? 'Appearing in daily practice' : 'Not in daily practice';
      phraseRecord.fields['In Active Rotation'] = current;
      TOAST.error('Could not update — try again');
    }
  }

  // ─── LEVEL UP ─────────────────────────────────
  async function levelUp() {
    if (!phraseRecord) return;
    const current = phraseRecord.fields['Mastery Level'] || 'New';
    const next = MASTERY.nextLevel(current);
    if (!next) return;

    const btn = document.getElementById('levelUpBtn');
    if (btn) {
      btn.disabled = true;
      btn.style.opacity = '0.6';
    }

    try {
      await AIRTABLE.updatePhraseMastery(phraseRecord.id, next);
      phraseRecord.fields['Mastery Level'] = next;
      TOAST.success(`Leveled up to ${next}!`);
      // Re-render to reflect new mastery + updated level-up button
      renderPhrase(phraseRecord);
    } catch (err) {
      console.error(err);
      if (btn) { btn.disabled = false; btn.style.opacity = ''; }
      TOAST.error('Could not level up — try again');
    }
  }

  // ─── UTILS ────────────────────────────────────
  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
</body>
</html>

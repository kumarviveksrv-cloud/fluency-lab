<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0E1A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>My Progress</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="design-system.css">
  <style>
    /* ── Stats grid 2×3 ── */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-3);
      margin-bottom: var(--space-6);
    }

    .stat-card-progress {
      background: var(--navy-mid);
      border: 1px solid var(--navy-border);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
      position: relative;
      overflow: hidden;
    }

    .stat-card-progress::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      opacity: 0;
      transition: opacity var(--transition-base);
    }

    .stat-card-progress.accent-teal {
      border-color: rgba(0,229,195,0.25);
    }
    .stat-card-progress.accent-teal::after {
      background: radial-gradient(circle at bottom right, var(--teal-glow) 0%, transparent 70%);
      opacity: 1;
    }

    .stat-card-progress.accent-amber {
      border-color: rgba(245,166,35,0.25);
    }
    .stat-card-progress.accent-amber::after {
      background: radial-gradient(circle at bottom right, var(--amber-glow) 0%, transparent 70%);
      opacity: 1;
    }

    .stat-card-progress.accent-purple {
      border-color: rgba(139,92,246,0.25);
    }
    .stat-card-progress.accent-purple::after {
      background: radial-gradient(circle at bottom right, rgba(139,92,246,0.12) 0%, transparent 70%);
      opacity: 1;
    }

    .stat-emoji {
      font-size: 20px;
      line-height: 1;
      margin-bottom: var(--space-1);
      position: relative;
      z-index: 1;
    }

    .stat-number {
      font-family: var(--font-display);
      font-size: var(--text-3xl);
      font-weight: 800;
      line-height: 1;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
      position: relative;
      z-index: 1;
    }

    .stat-number.teal   { color: var(--teal); }
    .stat-number.amber  { color: var(--amber); }
    .stat-number.purple { color: var(--mastery-practicing); }

    .stat-desc {
      font-size: var(--text-xs);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 500;
      line-height: 1.3;
      position: relative;
      z-index: 1;
    }

    /* ── Fluency stability calendar ── */
    .calendar-section {
      margin-bottom: var(--space-6);
    }

    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: var(--space-2);
      margin-top: var(--space-3);
    }

    .day-block {
      aspect-ratio: 1;
      border-radius: var(--radius-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      position: relative;
      transition: transform var(--transition-fast);
    }

    .day-block.practiced {
      background: var(--teal-glow);
      border: 1px solid var(--teal-dim);
    }

    .day-block.practiced::before {
      content: '';
      position: absolute;
      inset: 3px;
      border-radius: 3px;
      background: var(--teal);
      opacity: 0.25;
    }

    .day-block.missed {
      background: var(--navy-light);
      border: 1px solid var(--navy-border);
    }

    .day-block.today-marker {
      border-color: var(--teal);
      box-shadow: 0 0 0 1px var(--teal);
    }

    .day-label {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-muted);
      position: relative;
      z-index: 1;
    }

    .day-block.practiced .day-label {
      color: var(--teal);
    }

    .day-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      position: relative;
      z-index: 1;
    }

    .day-block.practiced .day-dot {
      background: var(--teal);
    }

    .day-block.missed .day-dot {
      background: var(--navy-border);
    }

    /* ── Phrase mastery bar chart ── */
    .mastery-section {
      margin-bottom: var(--space-6);
    }

    .mastery-row {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-2) 0;
    }

    .mastery-row + .mastery-row {
      border-top: 1px solid rgba(42, 51, 71, 0.5);
    }

    .mastery-level-name {
      font-size: var(--text-xs);
      font-weight: 500;
      color: var(--text-secondary);
      width: 90px;
      flex-shrink: 0;
    }

    .mastery-bar-track {
      flex: 1;
      height: 8px;
      background: var(--navy-border);
      border-radius: var(--radius-full);
      overflow: hidden;
      min-width: 0;
    }

    .mastery-bar-fill {
      height: 100%;
      border-radius: var(--radius-full);
      transition: width var(--transition-slow);
    }

    .mastery-count {
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      color: var(--text-muted);
      width: 24px;
      text-align: right;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    /* ── Recent sessions list ── */
    .session-card {
      background: var(--navy-mid);
      border: 1px solid var(--navy-border);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
    }

    .session-card + .session-card {
      margin-top: var(--space-3);
    }

    .session-header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: var(--space-3);
    }

    .session-date {
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--text-primary);
    }

    .session-duration {
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      color: var(--text-muted);
      background: var(--navy-light);
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-sm);
    }

    .score-pills {
      display: flex;
      gap: var(--space-2);
      flex-wrap: wrap;
    }

    .score-pill {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      font-size: var(--text-xs);
      color: var(--text-secondary);
    }

    .score-pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .score-pill-val {
      font-family: var(--font-mono);
      font-weight: 500;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
    }

    /* ── Skeleton rows ── */
    .skel-stat {
      height: 90px;
      border-radius: var(--radius-lg);
    }

    /* ── Trend indicator ── */
    .trend-up   { color: var(--teal); }
    .trend-down { color: var(--rose); }

    /* Tongue tie sub-label */
    .stat-sublabel {
      font-size: var(--text-xs);
      color: var(--text-muted);
      font-family: var(--font-mono);
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
<div class="app-shell">

  <!-- HEADER -->
  <header class="app-header">
    <div>
      <div class="header-title">My Progress</div>
      <div class="header-subtitle" id="headerSub">Tracking your fluency journey</div>
    </div>
    <div class="flex items-center gap-3">
      <span class="badge badge-teal" id="streakBadge">🔥 0</span>
    </div>
  </header>

  <!-- CONTENT -->
  <main class="app-content" id="mainContent">

    <!-- STATS GRID -->
    <section class="mb-4">
      <div class="section-header">
        <span class="section-title">Overview</span>
      </div>
      <div class="stats-grid" id="statsGrid">
        <!-- 6 skeleton cards while loading -->
        <div class="stat-card-progress skeleton skel-stat"></div>
        <div class="stat-card-progress skeleton skel-stat"></div>
        <div class="stat-card-progress skeleton skel-stat"></div>
        <div class="stat-card-progress skeleton skel-stat"></div>
        <div class="stat-card-progress skeleton skel-stat"></div>
        <div class="stat-card-progress skeleton skel-stat"></div>
      </div>
    </section>

    <!-- FLUENCY STABILITY -->
    <section class="calendar-section card">
      <div class="section-header" style="margin-bottom:0">
        <span class="section-title">Fluency Stability</span>
        <span class="body-xs text-muted">Last 7 days</span>
      </div>
      <div class="week-grid" id="weekGrid">
        <!-- Populated by JS -->
      </div>
    </section>

    <!-- PHRASE MASTERY BREAKDOWN -->
    <section class="mastery-section mt-6">
      <div class="section-header">
        <span class="section-title">Phrase Mastery</span>
      </div>
      <div class="card" id="masteryChart">
        <!-- Populated by JS -->
      </div>
    </section>

    <!-- RECENT SESSIONS -->
    <section class="mt-2">
      <div class="section-header">
        <span class="section-title">Recent Sessions</span>
        <span class="body-xs text-muted">Last 5</span>
      </div>
      <div id="recentSessions">
        <!-- Populated by JS -->
      </div>
    </section>

  </main>

  <!-- TAB BAR -->
  <div id="tabBar"></div>

</div>

<script src="app.js"></script>
<script src="airtable.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {

  // ── Tab bar ────────────────────────────────────────────────
  document.getElementById('tabBar').innerHTML = buildTabBar('progress');

  // ── Streak badge ───────────────────────────────────────────
  const streak = STORE.getStreak();
  document.getElementById('streakBadge').textContent = `🔥 ${streak}`;

  // ── Build week grid (independent of server data) ───────────
  buildWeekGrid([]);

  // ── Load progress data ─────────────────────────────────────
  try {
    const data = await AIRTABLE.getProgressData();
    renderStats(data.stats, streak);
    buildWeekGrid(data.sessions);
    renderMasteryChart(data.phrases);
    renderRecentSessions(data.sessions.slice(0, 5));
  } catch (err) {
    console.error(err);
    // Stats fallback
    document.getElementById('statsGrid').innerHTML = `
      <div style="grid-column:1/-1;">
        ${buildErrorHtml('Could not load progress data.', () => location.reload())}
      </div>
    `;
    showError(document.getElementById('recentSessions'), 'Could not load sessions.');
  }

  function buildErrorHtml(msg, retryFn) {
    return `
      <div class="empty-state" style="padding:2rem 0;">
        <div class="empty-icon">⚠️</div>
        <p class="body-sm text-secondary">${msg}</p>
        <button class="btn btn-secondary btn-sm mt-3" onclick="location.reload()">Try again</button>
      </div>
    `;
  }

  // ── Stats grid ─────────────────────────────────────────────
  function renderStats(stats, currentStreak) {
    if (!stats) return;

    const avgTT = stats.avgTongueTieScore;
    const ttDisplay = avgTT ? `${avgTT}` : '—';

    document.getElementById('statsGrid').innerHTML = `
      <div class="stat-card-progress accent-teal fade-in">
        <span class="stat-emoji">🔥</span>
        <span class="stat-number teal">${currentStreak}</span>
        <span class="stat-desc">Day streak</span>
      </div>

      <div class="stat-card-progress fade-in">
        <span class="stat-emoji">📅</span>
        <span class="stat-number">${stats.weeklyConsistency}</span>
        <span class="stat-desc">Days practiced this week</span>
      </div>

      <div class="stat-card-progress accent-teal fade-in">
        <span class="stat-emoji">💬</span>
        <span class="stat-number teal">${stats.phrasesAtMuscleMemory}</span>
        <span class="stat-desc">Muscle Memory+</span>
      </div>

      <div class="stat-card-progress accent-amber fade-in">
        <span class="stat-emoji">🌍</span>
        <span class="stat-number amber">${stats.totalRealDeployments}</span>
        <span class="stat-desc">Real deployments</span>
      </div>

      <div class="stat-card-progress fade-in">
        <span class="stat-emoji">📈</span>
        <span class="stat-number">${ttDisplay}</span>
        <span class="stat-desc">Avg Tongue-Tie</span>
        ${avgTT ? `<span class="stat-sublabel">out of 10</span>` : ''}
      </div>

      <div class="stat-card-progress accent-purple fade-in">
        <span class="stat-emoji">🎭</span>
        <span class="stat-number purple">${stats.charactersMastered}</span>
        <span class="stat-desc">Characters mastered</span>
      </div>
    `;
  }

  // ── Week grid ──────────────────────────────────────────────
  function buildWeekGrid(sessions) {
    const days = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
    const today = new Date();
    // Build the Mon–Sun week containing today
    const todayDow = today.getDay(); // 0=Sun
    const mondayOffset = todayDow === 0 ? -6 : 1 - todayDow;
    const weekDates = Array.from({ length: 7 }, (_, i) => {
      const d = new Date(today);
      d.setDate(today.getDate() + mondayOffset + i);
      return d;
    });

    // Build a set of practiced date strings
    const practicedSet = new Set(
      (sessions || []).map(s => s.fields?.['Date']).filter(Boolean)
    );

    const todayStr = today.toISOString().split('T')[0];

    const html = weekDates.map((d, i) => {
      const dStr = d.toISOString().split('T')[0];
      const practiced = practicedSet.has(dStr);
      const isToday   = dStr === todayStr;
      const isPast    = d < today && !isToday;

      let cls = practiced ? 'practiced' : 'missed';
      if (!isPast && !isToday) cls = 'missed'; // future = empty
      if (isToday) cls += ' today-marker';

      return `
        <div class="day-block ${cls}" title="${dStr}">
          <span class="day-label">${days[i]}</span>
          <div class="day-dot"></div>
        </div>
      `;
    }).join('');

    document.getElementById('weekGrid').innerHTML = html;
  }

  // ── Mastery bar chart ──────────────────────────────────────
  function renderMasteryChart(phrases) {
    const masteryLevels = [
      { name: 'New',           key: 'New',           color: 'var(--mastery-new)' },
      { name: 'Learning',      key: 'Learning',      color: 'var(--mastery-learning)' },
      { name: 'Practicing',    key: 'Practicing',    color: 'var(--mastery-practicing)' },
      { name: 'Deployed',      key: 'Deployed',      color: 'var(--mastery-deployed)' },
      { name: 'Muscle Memory', key: 'Muscle Memory', color: 'var(--mastery-muscle)' },
      { name: 'Signature',     key: 'Signature Move',color: 'var(--mastery-signature)' },
    ];

    const container = document.getElementById('masteryChart');

    if (!phrases || phrases.length === 0) {
      container.innerHTML = `
        <div class="empty-state" style="padding:2rem 0;">
          <div class="empty-icon">📚</div>
          <p class="empty-title">No phrases yet</p>
          <p class="empty-description">Add phrases in Airtable to see mastery breakdown.</p>
        </div>
      `;
      return;
    }

    // Count per level
    const counts = {};
    masteryLevels.forEach(l => { counts[l.key] = 0; });
    phrases.forEach(p => {
      const lvl = p.fields?.['Mastery Level'];
      if (lvl && counts[lvl] !== undefined) counts[lvl]++;
    });

    const maxCount = Math.max(...Object.values(counts), 1);

    container.innerHTML = masteryLevels.map(level => {
      const count = counts[level.key];
      const pct   = Math.round((count / maxCount) * 100);
      return `
        <div class="mastery-row">
          <span class="mastery-level-name" style="color:${level.color}">${level.name}</span>
          <div class="mastery-bar-track">
            <div class="mastery-bar-fill" style="width:${pct}%;background:${level.color};"></div>
          </div>
          <span class="mastery-count">${count}</span>
        </div>
      `;
    }).join('');
  }

  // ── Recent sessions ────────────────────────────────────────
  function renderRecentSessions(sessions) {
    const container = document.getElementById('recentSessions');

    if (!sessions || sessions.length === 0) {
      container.innerHTML = `
        <div class="empty-state" style="padding:2rem 0;">
          <div class="empty-icon">🏋️</div>
          <p class="empty-title">No sessions yet</p>
          <p class="empty-description">Complete your first practice session to see it here.</p>
        </div>
      `;
      return;
    }

    container.innerHTML = sessions.map(s => {
      const f = s.fields || {};
      const dateStr = f['Date']
        ? new Date(f['Date']).toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' })
        : '—';

      const confidence  = f['Confidence Score']  ?? f['Confidence']  ?? null;
      const coherence   = f['Coherence Score']   ?? f['Coherence']   ?? null;
      const charMatch   = f['Character Match']   ?? null;
      const duration    = f['Duration (mins)']   ?? f['Duration']    ?? null;

      const scores = [
        confidence !== null ? { label: 'Confidence',  val: confidence,  color: 'var(--teal)' }             : null,
        coherence  !== null ? { label: 'Coherence',   val: coherence,   color: 'var(--mastery-learning)' } : null,
        charMatch  !== null ? { label: 'Character',   val: `${charMatch}%`, color: 'var(--mastery-signature)' } : null,
      ].filter(Boolean);

      return `
        <div class="session-card fade-in">
          <div class="session-header-row">
            <div>
              <div class="session-date">${dateStr}</div>
              ${f['Time of Day'] ? `<div class="body-xs text-muted mt-1">${f['Time of Day']}</div>` : ''}
            </div>
            ${duration !== null ? `<span class="session-duration">${duration} min</span>` : ''}
          </div>
          ${scores.length > 0 ? `
            <div class="score-pills">
              ${scores.map(sc => `
                <div class="score-pill">
                  <div class="score-pill-dot" style="background:${sc.color}"></div>
                  <span>${sc.label}</span>
                  <span class="score-pill-val">${sc.val}</span>
                </div>
              `).join('')}
            </div>
          ` : '<p class="body-xs text-muted">Session recorded</p>'}
        </div>
      `;
    }).join('');
  }

});
</script>
</body>
</html>
